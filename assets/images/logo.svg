<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 454 100" width="100%" height="100%">
  <defs>
    <!-- Mask to create the gaps around the diagonal line -->
    <mask id="logo-mask">
      <!-- Everything white is visible -->
      <rect x="0" y="0" width="454" height="100" fill="white" />
      <!-- Black diagonal bar cuts out the gap -->
      <line x1="10" y1="90" x2="90" y2="10" stroke="black" stroke-width="12" stroke-linecap="square" />
    </mask>
  </defs>

  <!-- Logo Mark (Circle + AHA + Diagonal line) -->
  <g class="logo-mark">
    <!-- Circle with mask to create gaps -->
    <circle cx="50" cy="50" r="38" stroke="currentColor" stroke-width="6" fill="none" mask="url(#logo-mask)" />
    
    <!-- Text inside with mask to create gaps -->
    <g mask="url(#logo-mask)">
      <text x="50" y="57" font-family="'Hanken Grotesk', 'Inter', sans-serif" font-weight="900" font-size="22" fill="currentColor" text-anchor="middle" letter-spacing="1">AHA</text>
    </g>
    
    <!-- Diagonal line (drawn without mask) -->
    <line x1="13" y1="87" x2="87" y2="13" stroke="currentColor" stroke-width="6" stroke-linecap="butt" />
  </g>

  <!-- Logo Text Area -->
  <g class="logo-text" fill="currentColor">
    <!-- AHA ENGINEERING -->
    <text x="105" y="48" font-family="'Hanken Grotesk', sans-serif" font-style="italic">
      <tspan font-weight="900" font-size="38" letter-spacing="-0.02em">AHA </tspan>
      <tspan font-weight="500" font-size="34" font-family="'Inter', sans-serif" letter-spacing="-0.01em">ENGINEERING</tspan>
    </text>
    
    <!-- Tagline (Corrected Typo) -->
    <text x="105" y="75" font-family="'Inter', sans-serif" font-size="9" font-weight="600" textLength="330" lengthAdjust="spacing" class="logo-tagline">ENGINEERING THE FUTURE | BUILDING SOLUTIONS | DELIVERING EXCELLENCE</text>
  </g>
</svg>
